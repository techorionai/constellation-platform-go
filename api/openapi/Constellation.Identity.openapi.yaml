openapi: 3.0.0
info:
  title: Constellation Identity
  description: |-
    The identity service API. The OAuth and OIDC endpoints use standard paths and RFC 6749 errors.
    The other operations use the prefix `/v1` and RFC 9457 errors.
    The permission manifest of the service is in `services/identity/manifest.json`.
  version: 0.0.0
tags: []
paths:
  /.well-known/jwks.json:
    get:
      operationId: Discovery_jwks
      description: |-
        Get the public keys that verify the tokens of the service.
        Error code of `TooManyRequests`: `rate_limited`.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonWebKeySet'
        '429':
          description: The client sent too many requests.
          headers:
            Retry-After:
              required: true
              description: Seconds to wait before the next request.
              schema:
                type: integer
                format: int32
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
      security:
        - {}
  /.well-known/openid-configuration:
    get:
      operationId: Discovery_openidConfiguration
      description: |-
        Get the OIDC discovery document.
        Error code of `TooManyRequests`: `rate_limited`.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryDocument'
        '429':
          description: The client sent too many requests.
          headers:
            Retry-After:
              required: true
              description: Seconds to wait before the next request.
              schema:
                type: integer
                format: int32
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
      security:
        - {}
  /oauth/authorize:
    get:
      operationId: OAuth_authorize
      description: |-
        Start the authorization code flow with PKCE.
        The server shows a login page, or it redirects with `code` and `state`, or with an error.
        The query has `response_type` (`code`), `client_id`, `redirect_uri`, `scope`, `state`, `nonce`,
        `code_challenge`, and `code_challenge_method` (`S256`). `prompt` and `max_age` are optional.
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum:
              - code
          explode: false
        - name: client_id
          in: query
          required: true
          schema:
            type: string
          explode: false
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
          explode: false
        - name: scope
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/RequestScopeString'
          explode: false
        - name: state
          in: query
          required: true
          schema:
            type: string
          explode: false
        - name: nonce
          in: query
          required: true
          schema:
            type: string
          explode: false
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
          explode: false
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            enum:
              - S256
          explode: false
        - name: prompt
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: max_age
          in: query
          required: false
          schema:
            type: integer
            format: int32
          explode: false
      responses:
        '200':
          description: A page that the server shows to a person in a browser.
          content:
            text/html:
              schema:
                type: string
        '302':
          description: A redirect to another URL.
          headers:
            location:
              required: true
              description: The URL to go to.
              schema:
                type: string
        '429':
          description: |-
            A page that tells a person in a browser to try again later. The service limits the rate of requests.
            The status, the body, and `Retry-After` do not change when a `client_id` or a user exists or does not exist.
            The response does not give the limit key, the limit value, or the remaining requests.
            The emitter writes the body as an inline string schema. The generated file has no named schema for this model.
          headers:
            Retry-After:
              required: true
              description: Seconds to wait before the next request.
              schema:
                type: integer
                format: int32
                minimum: 1
          content:
            text/html:
              schema:
                type: string
        '503':
          description: |-
            A page that tells a person in a browser to try again later. The service cannot do the request now.
            The emitter writes the body as an inline string schema. The generated file has no named schema for this model.
          headers:
            Retry-After:
              required: false
              description: Seconds to wait before the next request.
              schema:
                type: integer
                format: int32
                minimum: 1
          content:
            text/html:
              schema:
                type: string
      security:
        - {}
  /oauth/end_session:
    get:
      operationId: OAuth_endSession
      description: |-
        End the session of a user (OIDC RP-initiated logout).
        The server shows a page, or it redirects to `post_logout_redirect_uri` with `state`.
      parameters:
        - name: id_token_hint
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: post_logout_redirect_uri
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: state
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: A page that the server shows to a person in a browser.
          content:
            text/html:
              schema:
                type: string
        '302':
          description: A redirect to another URL.
          headers:
            location:
              required: true
              description: The URL to go to.
              schema:
                type: string
        '429':
          description: |-
            A page that tells a person in a browser to try again later. The service limits the rate of requests.
            The status, the body, and `Retry-After` do not change when a `client_id` or a user exists or does not exist.
            The response does not give the limit key, the limit value, or the remaining requests.
            The emitter writes the body as an inline string schema. The generated file has no named schema for this model.
          headers:
            Retry-After:
              required: true
              description: Seconds to wait before the next request.
              schema:
                type: integer
                format: int32
                minimum: 1
          content:
            text/html:
              schema:
                type: string
        '503':
          description: |-
            A page that tells a person in a browser to try again later. The service cannot do the request now.
            The emitter writes the body as an inline string schema. The generated file has no named schema for this model.
          headers:
            Retry-After:
              required: false
              description: Seconds to wait before the next request.
              schema:
                type: integer
                format: int32
                minimum: 1
          content:
            text/html:
              schema:
                type: string
      security:
        - {}
  /oauth/introspect:
    post:
      operationId: OAuth_introspect
      description: |-
        Introspect a token (RFC 7662). Only a service client with `private_key_jwt` can call it.
        Any other caller gets 401 `invalid_client` and learns nothing about the token.
        Other callers are a public client, a bad or missing assertion, `client_secret`, and `Authorization: Basic`.
        A repeated form field gives `invalid_request`.
        In some cases the identity service returns `active: false` and no other field. The cases are:
        an unknown, expired, or revoked token, and a token of a disabled user.
        Also a JWT, and a token with no scope for the caller app.
        For an active token, `scope` is the stored scope of the token.
        Intersect it with the current permissions of the user.
        Then keep only the scopes that start with `<caller app>:`.
        If the result is empty, the response is `{active:false}`. `aud` is the caller app.
        The response has the headers `Cache-Control: no-store` and `Pragma: no-cache`.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              description: Cache rule.
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              description: Cache rule for old HTTP/1.0 caches.
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntrospectResponse'
        '400':
          description: |-
            Error body of an OAuth operation (RFC 6749 section 5.2).
            The status is 400, except for these codes. `invalid_client` is 401.
            `server_error` is 500. `temporarily_unavailable` is 503 when the service cannot do the request now.
            `temporarily_unavailable` is 429 for a rate limit (model `OAuthTooManyRequests`).
            The client can try again after `Retry-After` of a 429 response. A 503 response of this model has no `Retry-After`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '401':
          description: |-
            Error body of an OAuth operation (RFC 6749 section 5.2).
            The status is 400, except for these codes. `invalid_client` is 401.
            `server_error` is 500. `temporarily_unavailable` is 503 when the service cannot do the request now.
            `temporarily_unavailable` is 429 for a rate limit (model `OAuthTooManyRequests`).
            The client can try again after `Retry-After` of a 429 response. A 503 response of this model has no `Retry-After`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '429':
          description: |-
            An OAuth operation limits the rate of requests (RFC 6749 section 5.2).
            The `error` is `temporarily_unavailable`. The client tries again after `Retry-After`.
            The body has the same fields as `OAuthError`.
            The status, the body, and `Retry-After` do not change when a `client_id` or a user exists or does not exist.
            The response does not give the limit key, the limit value, or the remaining requests.
          headers:
            Retry-After:
              required: true
              description: Seconds to wait before the next request.
              schema:
                type: integer
                format: int32
                minimum: 1
            Cache-Control:
              required: true
              description: The response has the value `no-store`.
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              description: The response has the value `no-cache`.
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTooManyRequests'
        '500':
          description: |-
            Error body of an OAuth operation (RFC 6749 section 5.2).
            The status is 400, except for these codes. `invalid_client` is 401.
            `server_error` is 500. `temporarily_unavailable` is 503 when the service cannot do the request now.
            `temporarily_unavailable` is 429 for a rate limit (model `OAuthTooManyRequests`).
            The client can try again after `Retry-After` of a 429 response. A 503 response of this model has no `Retry-After`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '503':
          description: |-
            Error body of an OAuth operation (RFC 6749 section 5.2).
            The status is 400, except for these codes. `invalid_client` is 401.
            `server_error` is 500. `temporarily_unavailable` is 503 when the service cannot do the request now.
            `temporarily_unavailable` is 429 for a rate limit (model `OAuthTooManyRequests`).
            The client can try again after `Retry-After` of a 429 response. A 503 response of this model has no `Retry-After`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IntrospectRequest'
      security:
        - {}
  /oauth/revoke:
    post:
      operationId: OAuth_revoke
      description: |-
        Revoke a token (RFC 7009).
        The response is 200 with no body. This is also true for an unknown token.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
        '400':
          description: |-
            Error body of an OAuth operation (RFC 6749 section 5.2).
            The status is 400, except for these codes. `invalid_client` is 401.

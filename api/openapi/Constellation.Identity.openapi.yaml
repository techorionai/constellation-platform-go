openapi: 3.0.0
info:
  title: Constellation Identity
  description: |-
    The identity service API. The OAuth and OIDC endpoints use standard paths and RFC 6749 errors.
    The other operations use the prefix `/v1` and RFC 9457 errors.
    The permission manifest of the service is in `services/identity/manifest.json`.
  version: 0.0.0
tags: []
paths:
  /.well-known/jwks.json:
    get:
      operationId: Discovery_jwks
      description: Get the public keys that verify the tokens of the service.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonWebKeySet'
      security:
        - {}
  /.well-known/openid-configuration:
    get:
      operationId: Discovery_openidConfiguration
      description: Get the OIDC discovery document.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryDocument'
      security:
        - {}
  /oauth/authorize:
    get:
      operationId: OAuth_authorize
      description: |-
        Start the authorization code flow with PKCE.
        The server shows a login page, or it redirects with `code` and `state`, or with an error.
        The query has `response_type` (`code`), `client_id`, `redirect_uri`, `scope`, `state`, `nonce`,
        `code_challenge`, and `code_challenge_method` (`S256`). `prompt` and `max_age` are optional.
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum:
              - code
          explode: false
        - name: client_id
          in: query
          required: true
          schema:
            type: string
          explode: false
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
          explode: false
        - name: scope
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/RequestScopeString'
          explode: false
        - name: state
          in: query
          required: true
          schema:
            type: string
          explode: false
        - name: nonce
          in: query
          required: true
          schema:
            type: string
          explode: false
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
          explode: false
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            enum:
              - S256
          explode: false
        - name: prompt
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: max_age
          in: query
          required: false
          schema:
            type: integer
            format: int32
          explode: false
      responses:
        '200':
          description: A page that the server shows to a person in a browser.
          content:
            text/html:
              schema:
                type: string
        '302':
          description: A redirect to another URL.
          headers:
            location:
              required: true
              description: The URL to go to.
              schema:
                type: string
      security:
        - {}
  /oauth/end_session:
    get:
      operationId: OAuth_endSession
      description: |-
        End the session of a user (OIDC RP-initiated logout).
        The server shows a page, or it redirects to `post_logout_redirect_uri` with `state`.
      parameters:
        - name: id_token_hint
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: post_logout_redirect_uri
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: state
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: A page that the server shows to a person in a browser.
          content:
            text/html:
              schema:
                type: string
        '302':
          description: A redirect to another URL.
          headers:
            location:
              required: true
              description: The URL to go to.
              schema:
                type: string
      security:
        - {}
  /oauth/revoke:
    post:
      operationId: OAuth_revoke
      description: |-
        Revoke a token (RFC 7009).
        The response is 200 with no body. This is also true for an unknown token.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
        '400':
          description: |-
            Error body of an OAuth operation (RFC 6749 section 5.2).
            The status is 400, except for these codes. `invalid_client` is 401.
            `server_error` is 500. `temporarily_unavailable` is 503.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '401':
          description: |-
            Error body of an OAuth operation (RFC 6749 section 5.2).
            The status is 400, except for these codes. `invalid_client` is 401.
            `server_error` is 500. `temporarily_unavailable` is 503.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '500':
          description: |-
            Error body of an OAuth operation (RFC 6749 section 5.2).
            The status is 400, except for these codes. `invalid_client` is 401.
            `server_error` is 500. `temporarily_unavailable` is 503.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '503':
          description: |-
            Error body of an OAuth operation (RFC 6749 section 5.2).
            The status is 400, except for these codes. `invalid_client` is 401.
            `server_error` is 500. `temporarily_unavailable` is 503.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RevokeRequest'
      security:
        - {}
  /oauth/token:
    post:
      operationId: OAuth_token
      description: |-
        Get an access token. The `grant_type` is `client_credentials`, `authorization_code`, or `refresh_token`.
        The `scope` of the request can have OIDC scopes. The `scope` of the response has permission keys only.
        The response has the headers `Cache-Control: no-store` and `Pragma: no-cache`.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              description: Cache rule.
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              description: Cache rule for old HTTP/1.0 caches.
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: |-
            Error body of an OAuth operation (RFC 6749 section 5.2).
            The status is 400, except for these codes. `invalid_client` is 401.
            `server_error` is 500. `temporarily_unavailable` is 503.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '401':
          description: |-
            Error body of an OAuth operation (RFC 6749 section 5.2).
            The status is 400, except for these codes. `invalid_client` is 401.
            `server_error` is 500. `temporarily_unavailable` is 503.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '500':
          description: |-
            Error body of an OAuth operation (RFC 6749 section 5.2).
            The status is 400, except for these codes. `invalid_client` is 401.
            `server_error` is 500. `temporarily_unavailable` is 503.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '503':
          description: |-
            Error body of an OAuth operation (RFC 6749 section 5.2).
            The status is 400, except for these codes. `invalid_client` is 401.
            `server_error` is 500. `temporarily_unavailable` is 503.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      security:
        - {}
  /oauth/userinfo:
    get:
      operationId: OAuth_userinfo
      description: |-
        Get the claims of the user of an access token.
        It accepts a user access token of the identity issuer with any audience.
        All clients are first-party, so the response has all four claims.
        A service token gets 403 with `error="insufficient_scope"`.
        The response has the headers `Cache-Control: no-store` and `Pragma: no-cache`.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              description: Cache rule.
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              description: Cache rule for old HTTP/1.0 caches.
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '401':
          description: The access token is not valid (RFC 6750). The response has no body.
          headers:
            WWW-Authenticate:
              required: true
              description: Challenge, for example `Bearer error="invalid_token"`.
              schema:
                type: string
        '403':
          description: |-
            The access token does not have enough scope, or it is a service token on a user operation (RFC 6750).
            The response has no body.
          headers:
            WWW-Authenticate:
              required: true
              description: Challenge, for example `Bearer error="insufficient_scope"`.
              schema:
                type: string
  /v1/clients:
    post:
      operationId: Clients_create
      description: |-
        Create a client. The token needs `identity:client:write` and `identity:admin`.
        Error codes of `UnprocessableContent`: `invalid_redirect_uri` and `app_reserved`.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          description: The request is not valid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: The request has no valid credentials.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: The principal does not have the permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '422':
          description: The request is well formed, but the server cannot process its content.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnprocessableContent'
        '500':
          description: The server has an internal error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreate'
      x-required-scopes:
        - identity:client:write
        - identity:admin
    get:
      operationId: Clients_list
      description: List the clients.
      parameters:
        - $ref: '#/components/parameters/CursorPageParams.pageToken'
        - $ref: '#/components/parameters/CursorPageParams.pageSize'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientPage'
        '400':
          description: The request is not valid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: The request has no valid credentials.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: The principal does not have the permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '500':
          description: The server has an internal error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      x-required-scopes:
        - identity:client:read
  /v1/clients/{clientId}:
    get:
      operationId: Clients_get
      description: Get one client.
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          description: The request is not valid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: The request has no valid credentials.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: The principal does not have the permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: The resource does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: The server has an internal error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      x-required-scopes:
        - identity:client:read
    patch:
      operationId: Clients_update
      description: |-
        Change a client. The token needs `identity:client:write` and `identity:admin`.
        The `app` of a client cannot change. Error code of `Conflict`: `client_managed_by_config`.
        Error codes of `UnprocessableContent`: `invalid_redirect_uri`, `client_type_immutable`, and `app_reserved`.
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          description: The request is not valid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: The request has no valid credentials.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: The principal does not have the permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: The resource does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '409':
          description: The request conflicts with the state of the resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '422':
          description: The request is well formed, but the server cannot process its content.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnprocessableContent'
        '500':
          description: The server has an internal error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientUpdate'
      x-required-scopes:
        - identity:client:write
        - identity:admin
  /v1/clients/{clientId}/keys:
    post:
      operationId: ClientKeys_add
      description: |-
        Add a public key to a service client. The token needs `identity:client:write` and `identity:admin`.
        Error code of `Conflict`: `client_managed_by_config`.
        Error codes of `UnprocessableContent`: `client_type_unsupported` and `invalid_jwk`.
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientKey'
        '400':
          description: The request is not valid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: The request has no valid credentials.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: The principal does not have the permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: The resource does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '409':
          description: The request conflicts with the state of the resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '422':
          description: The request is well formed, but the server cannot process its content.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnprocessableContent'
        '500':
          description: The server has an internal error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonWebKey'
      x-required-scopes:
        - identity:client:write
        - identity:admin
  /v1/clients/{clientId}/keys/{kid}:
    delete:
      operationId: ClientKeys_remove
      description: |-
        Remove a key from a service client. The token needs `identity:client:write` and `identity:admin`.
        Error code of `Conflict`: `client_managed_by_config`.
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
        - name: kid
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '400':
          description: The request is not valid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: The request has no valid credentials.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: The principal does not have the permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: The resource does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '409':
          description: The request conflicts with the state of the resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '500':
          description: The server has an internal error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      x-required-scopes:
        - identity:client:write
        - identity:admin
  /v1/clients/{clientId}/roles:
    get:
      operationId: ClientRoles_list
      description: 'List the roles of a service client. Error code of `UnprocessableContent`: `client_type_unsupported`.'
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CursorPageParams.pageToken'
        - $ref: '#/components/parameters/CursorPageParams.pageSize'
      responses:
        '200':
          description: The request has succeeded.

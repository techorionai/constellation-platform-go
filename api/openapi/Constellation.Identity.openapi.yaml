  /oauth/token:
    post:
      operationId: OAuth_token
      description: |-
        Get an access token. The `grant_type` is `client_credentials`, `authorization_code`, `refresh_token`,
        or `urn:ietf:params:oauth:grant-type:token-exchange` (RFC 8693).
        The `scope` of the request can have OIDC scopes. The `scope` of the response has permission keys only.
        The response has the headers `Cache-Control: no-store` and `Pragma: no-cache`.

        Token exchange rules. The parameters `subject_token`, `subject_token_type`, `audience`, and `scope` are required.
        `actor_token` and `actor_token_type` are optional and appear together.
        `requested_token_type` is optional. Its only value is `urn:ietf:params:oauth:token-type:access_token`.
        The actor token is the ID of an agent, not a signed token.
        The error codes are:
        `invalid_client` (401): only a service client with `private_key_jwt` can use the grant.
        `unauthorized_client`: the client does not have the permission `identity:token:exchange`.
        `invalid_request`: a repeated parameter, `actor_token` without `actor_token_type` or the reverse, or a missing required parameter.
        `unsupported_token_type`: `subject_token_type` is not the access token URI,
        or `actor_token_type` is not `urn:constellation:params:oauth:token-type:agent-id`,
        or `requested_token_type` is not the access token URI.
        `invalid_grant`: the subject token is not a JWT user access token (`typ` `at+jwt`) of the identity issuer,
        or it is expired, or its `principal_type` is not `user`, or it has `act`, or its user does not exist or is disabled.
        A service token, a token with `act`, an exchanged token, and an API token (`cpat_`) are not valid subject tokens.
        `invalid_grant` is also the code if the `aud` of the subject token is not the `app` of the authenticated client.
        `invalid_grant` is also the code if the agent does not exist, is disabled, or does not belong to the authenticated client.
        The error text is the same for all three cases.
        `invalid_target`: `audience` is not one app key, or it is `identity`.
        `invalid_scope`: the granted scope is the permissions of the user. If there is an actor,
        it is also intersected with the permissions of the agent. A requested scope that is not in the granted set fails.
        `invalid_scope` is also the code for an OIDC scope (`openid`, `profile`, `email`, `offline_access`),
        and for a scope that does not start with `<audience>:`.
        The response has no `refresh_token` and no `id_token`.
        The `exp` of the new token is not later than the `exp` of the subject token.
        The new token has `sub` of the user. If there is an actor, it has `act` with `principal_type` `agent`.
        The response has `issued_token_type`.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              description: Cache rule.
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              description: Cache rule for old HTTP/1.0 caches.
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: |-
            Error body of an OAuth operation (RFC 6749 section 5.2).
            The status is 400, except for these codes. `invalid_client` is 401.
            `server_error` is 500. `temporarily_unavailable` is 503 when the service cannot do the request now.
            `temporarily_unavailable` is 429 for a rate limit (model `OAuthTooManyRequests`).
            The client can try again after `Retry-After` of a 429 response. A 503 response of this model has no `Retry-After`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '401':
          description: |-
            Error body of an OAuth operation (RFC 6749 section 5.2).
            The status is 400, except for these codes. `invalid_client` is 401.
            `server_error` is 500. `temporarily_unavailable` is 503 when the service cannot do the request now.
            `temporarily_unavailable` is 429 for a rate limit (model `OAuthTooManyRequests`).
            The client can try again after `Retry-After` of a 429 response. A 503 response of this model has no `Retry-After`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '429':
          description: |-
            An OAuth operation limits the rate of requests (RFC 6749 section 5.2).
            The `error` is `temporarily_unavailable`. The client tries again after `Retry-After`.
            The body has the same fields as `OAuthError`.
            The status, the body, and `Retry-After` do not change when a `client_id` or a user exists or does not exist.
            The response does not give the limit key, the limit value, or the remaining requests.
          headers:
            Retry-After:
              required: true
              description: Seconds to wait before the next request.
              schema:
                type: integer
                format: int32
                minimum: 1
            Cache-Control:
              required: true
              description: The response has the value `no-store`.
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              description: The response has the value `no-cache`.
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTooManyRequests'
        '500':
          description: |-
            Error body of an OAuth operation (RFC 6749 section 5.2).
            The status is 400, except for these codes. `invalid_client` is 401.
            `server_error` is 500. `temporarily_unavailable` is 503 when the service cannot do the request now.
            `temporarily_unavailable` is 429 for a rate limit (model `OAuthTooManyRequests`).
            The client can try again after `Retry-After` of a 429 response. A 503 response of this model has no `Retry-After`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '503':
          description: |-
            Error body of an OAuth operation (RFC 6749 section 5.2).
            The status is 400, except for these codes. `invalid_client` is 401.
            `server_error` is 500. `temporarily_unavailable` is 503 when the service cannot do the request now.
            `temporarily_unavailable` is 429 for a rate limit (model `OAuthTooManyRequests`).
            The client can try again after `Retry-After` of a 429 response. A 503 response of this model has no `Retry-After`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      security:
        - {}
  /oauth/userinfo:
    get:
      operationId: OAuth_userinfo
      description: |-
        Get the claims of the user of an access token.
        It accepts a user access token of the identity issuer with any audience.
        All clients are first-party, so the response has all four claims.
        A service token gets 403 with `error="insufficient_scope"`.
        The response has the headers `Cache-Control: no-store` and `Pragma: no-cache`.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              description: Cache rule.
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              description: Cache rule for old HTTP/1.0 caches.
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '401':
          description: The access token is not valid (RFC 6750). The response has no body.
          headers:
            WWW-Authenticate:
              required: true
              description: Challenge, for example `Bearer error="invalid_token"`.
              schema:
                type: string
        '403':
          description: |-
            The access token does not have enough scope, or it is a service token on a user operation (RFC 6750).
            The response has no body.
          headers:
            WWW-Authenticate:
              required: true
              description: Challenge, for example `Bearer error="insufficient_scope"`.
              schema:
                type: string
        '429':
          description: |-
            An OAuth operation limits the rate of requests (RFC 6749 section 5.2).
            The `error` is `temporarily_unavailable`. The client tries again after `Retry-After`.
            The body has the same fields as `OAuthError`.
            The status, the body, and `Retry-After` do not change when a `client_id` or a user exists or does not exist.
            The response does not give the limit key, the limit value, or the remaining requests.
          headers:
            Retry-After:
              required: true
              description: Seconds to wait before the next request.
              schema:
                type: integer
                format: int32
                minimum: 1
            Cache-Control:
              required: true
              description: The response has the value `no-store`.
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              description: The response has the value `no-cache`.
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTooManyRequests'
        '503':
          description: |-
            An OAuth operation cannot do the request now, for example because the rate limiter is not available.
            The `error` is `temporarily_unavailable`. The body has the same fields as `OAuthError`.
          headers:
            Retry-After:
              required: false
              description: Seconds to wait before the next request.
              schema:
                type: integer
                format: int32
                minimum: 1
            Cache-Control:
              required: true
              description: The response has the value `no-store`.
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              description: The response has the value `no-cache`.
              schema:
                type: string

security:
  - BearerAuth: []
components:
  parameters:
    CursorPageParams.pageSize:
      name: pageSize
      in: query
      required: false
      description: Maximum number of items in the page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50
      explode: false
    CursorPageParams.pageToken:
      name: pageToken
      in: query
      required: false
      description: Opaque token from `nextPageToken` of the previous page.
      schema:
        type: string
        maxLength: 1024
      explode: false
  schemas:
    Agent:
      type: object
      required:
        - id
        - name
        - clientId
        - enabled
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: ID of the agent.
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Name of the agent. It is unique and case-sensitive.
        clientId:
          type: string
          description: ID of the service client that can act as the agent.
        enabled:
          type: boolean
          description: True if the agent is enabled.
        createdAt:
          type: string
          format: date-time
          description: Time when the agent was created.
        updatedAt:
          type: string
          format: date-time
          description: Time when the agent was changed.
      description: An agent principal.
    AgentCreate:
      type: object
      required:
        - name
        - clientId
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Name of the agent. It is unique and case-sensitive.
        clientId:
          type: string
          description: ID of the service client that can act as the agent.
      description: Request to create an agent.
    AgentPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
          description: Items of the page.
        nextPageToken:
          type: string
          description: Token for the next page. No value means that this is the last page.
      description: One page of agents.
    AgentUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Name of the agent.
        enabled:
          type: boolean
          description: True to enable the agent. False to disable it.
      description: Request to change an agent. A field that is not present does not change.
    ApiToken:
      type: object
      required:
        - id
        - userId
        - name
        - scope
        - createdAt
        - expiresAt
      properties:
        id:
          type: string
          format: uuid
          description: ID of the token.
        userId:
          type: string
          description: ID of the user that owns the token.
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Name of the token.
        scope:
          allOf:
            - $ref: '#/components/schemas/ScopeString'
          description: Permission keys of the token.
        createdAt:
          type: string
          format: date-time
          description: Time when the token was created.
        expiresAt:
          type: string
          format: date-time
          description: Time when the token expires.
        lastUsedAt:
          type: string
          format: date-time
          description: Time when the token was last used.
        revokedAt:
          type: string
          format: date-time
          description: Time when the token was revoked.
      description: A personal API token. It has no secret.
    ApiTokenCreate:
      type: object
      required:
        - name
        - scope
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Name of the token.
        scope:
          allOf:
            - $ref: '#/components/schemas/ScopeString'
          description: Permission keys of the token, at least one. An OIDC scope is not valid.
        expiresInDays:
          type: integer
          format: int32
          minimum: 1
          maximum: 365
          description: Days until the token expires. The identity service can set a lower maximum.
          default: 90
      description: Request to create a personal API token.
    ApiTokenCreated:
      type: object
      required:
        - id
        - userId
        - name
        - scope
        - createdAt
        - expiresAt
        - token
      properties:
        id:
          type: string
          format: uuid
          description: ID of the token.
        userId:
          type: string
          description: ID of the user that owns the token.
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Name of the token.
        scope:
          allOf:
            - $ref: '#/components/schemas/ScopeString'
          description: Permission keys of the token.
        createdAt:
          type: string
          format: date-time
          description: Time when the token was created.
        expiresAt:
          type: string
          format: date-time
          description: Time when the token expires.
        lastUsedAt:
          type: string
          format: date-time
          description: Time when the token was last used.
        revokedAt:
          type: string
          format: date-time
          description: Time when the token was revoked.
        token:
          type: string
          format: password
          description: |-
            The token. The format is `cpat_` followed by 43 base64url characters (32 random bytes).
            The identity service shows it one time only.
      description: A new personal API token. The response has the token one time only.
    ApiTokenPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiToken'
          description: Items of the page.
        nextPageToken:
          type: string
          description: Token for the next page. No value means that this is the last page.
      description: One page of personal API tokens.
    AppKey:
      type: string
      maxLength: 32
      pattern: ^[a-z][a-z0-9_]*$
      description: Key of an application, for example `helpdesk` or `customer_portal`.
    AssignmentSource:
      type: string
      enum:
        - config
        - api
      description: Where a role assignment comes from.
    BadRequest:
      type: object
      allOf:
        - $ref: '#/components/schemas/Problem'
      description: The request is not valid.
    Client:
      type: object
      required:
        - id
        - type
        - app
        - source
        - name
        - disabled
      properties:
        id:
          type: string
          description: ID of the client.
        type:
          allOf:
            - $ref: '#/components/schemas/ClientType'
          description: Type of the client.
        app:
          allOf:
            - $ref: '#/components/schemas/AppKey'
          description: Application of the client.
        source:
          allOf:
            - $ref: '#/components/schemas/ClientSource'
          description: Where the client comes from.
        name:
          type: string
          description: Display name of the client.
        redirectUris:
          type: array
          items:
            type: string
          description: Allowed redirect URIs. Public clients only.
        postLogoutRedirectUris:
          type: array
          items:
            type: string
          description: Allowed post logout redirect URIs. Public clients only.
        disabled:
          type: boolean
          description: True if the client is disabled.
        keys:
          type: array
          items:
            $ref: '#/components/schemas/ClientKey'
          description: Public keys. Service clients only.
      description: |-
        An OAuth client.
        `app` is the audience of its tokens. A service client has the `app` of its service.
        A public client has the `app` of the application that it signs users in to.
    ClientCreate:
      type: object
      required:
        - type
        - app
        - name
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/ClientType'
          description: Type of the client.
        app:
          allOf:
            - $ref: '#/components/schemas/AppKey'
          description: Application of the client.
        name:
          type: string
          description: Display name of the client.
        redirectUris:
          type: array
          items:
            type: string
          description: Allowed redirect URIs. Public clients only.
        postLogoutRedirectUris:
          type: array
          items:
            type: string
          description: Allowed post logout redirect URIs. Public clients only.
        jwk:
          allOf:
            - $ref: '#/components/schemas/JsonWebKey'
          description: Public key. Service clients only.
      description: Request to create a client.
    ClientKey:
      type: object
      required:
        - kid
        - jwk
        - createdAt
      properties:
        kid:
          type: string
          description: ID of the key.
        jwk:
          allOf:
            - $ref: '#/components/schemas/JsonWebKey'
          description: The public key.
        createdAt:
          type: string
          format: date-time
          description: Time when the key was added.
      description: A public key of a service client.
    ClientPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Client'
          description: Items of the page.
        nextPageToken:
          type: string
          description: Token for the next page. No value means that this is the last page.
      description: One page of clients.
    ClientSource:
      type: string
      enum:
        - config
        - api
      description: Where a client comes from.
    ClientType:
      type: string
      enum:
        - service
        - public
      description: Type of a client.
    ClientUpdate:
      type: object
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/ClientType'
          description: The type cannot change. A different value gives `client_type_immutable`.
        name:
          type: string
          description: Display name of the client.
        redirectUris:
          type: array
          items:
            type: string
          description: Allowed redirect URIs. Public clients only.
        postLogoutRedirectUris:
          type: array
          items:
            type: string
          description: Allowed post logout redirect URIs. Public clients only.
        disabled:
          type: boolean
          description: True to disable the client.
      description: Request to change a client. A field that is not present does not change. It has no `app`, because the `app` of a client cannot change.
    Conflict:
      type: object
      allOf:
        - $ref: '#/components/schemas/Problem'
      description: The request conflicts with the state of the resource.
    DiscoveryDocument:
      type: object
      required:
        - issuer
        - authorization_endpoint
        - token_endpoint
        - jwks_uri
        - userinfo_endpoint
        - revocation_endpoint
        - end_session_endpoint
        - response_types_supported
        - grant_types_supported
        - subject_types_supported
        - id_token_signing_alg_values_supported
        - scopes_supported
        - token_endpoint_auth_methods_supported
        - token_endpoint_auth_signing_alg_values_supported
        - code_challenge_methods_supported
      properties:
        issuer:
          type: string
          format: uri
          description: Issuer URL.
        authorization_endpoint:
          type: string
          format: uri
          description: URL of the authorize endpoint.
        token_endpoint:
          type: string
          format: uri
          description: URL of the token endpoint.
        jwks_uri:
          type: string
          format: uri
          description: URL of the key set.
        userinfo_endpoint:
          type: string
          format: uri
          description: URL of the userinfo endpoint.
        revocation_endpoint:
          type: string
          format: uri
          description: URL of the revoke endpoint.
        end_session_endpoint:
          type: string
          format: uri
          description: URL of the end session endpoint.
        response_types_supported:
          type: array
          items:
            type: string
          description: Supported response types.
        grant_types_supported:
          type: array
          items:
            type: string
          description: Supported grant types. They include `urn:ietf:params:oauth:grant-type:token-exchange`.
        introspection_endpoint:
          type: string
          format: uri
          description: URL of the introspection endpoint.
        subject_types_supported:
          type: array
          items:
            type: string
          description: Supported subject types.
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
          description: Supported algorithms of the ID token signature.
        scopes_supported:
          type: array
          items:
            type: string
          description: Supported scopes.
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
          description: Supported methods of client authentication.
        token_endpoint_auth_signing_alg_values_supported:
          type: array
          items:
            type: string
          description: Supported algorithms of the client assertion signature.
        code_challenge_methods_supported:
          type: array
          items:
            type: string
          description: Supported PKCE methods.
      additionalProperties: {}
      description: The OIDC discovery document. The model is open, so the service can add fields later.
    FieldError:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          description: JSON Pointer to the incorrect value.
        code:
          type: string
          description: Stable code that a machine can read.
        message:
          type: string
          description: Message for a person.
      description: One incorrect field of a request.
    Forbidden:
      type: object
      properties:
        missingScopes:
          type: array
          items:
            $ref: '#/components/schemas/PermissionKey'
          description: Permissions that the principal lacks. An agent uses them to ask the user for approval.
      allOf:
        - $ref: '#/components/schemas/Problem'
      description: The principal does not have the permission.
    GrantType:
      anyOf:
        - type: string
          enum:
            - client_credentials
            - authorization_code
            - refresh_token
            - urn:ietf:params:oauth:grant-type:token-exchange
        - type: string
      description: Grant type of a token request. The union is open, so a later release can add a grant type.
    InternalServerError:
      type: object
      allOf:
        - $ref: '#/components/schemas/Problem'
      description: The server has an internal error.
    IntrospectRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          maxLength: 512
          format: password
          description: The token to introspect.
        token_type_hint:
          allOf:
            - $ref: '#/components/schemas/IntrospectTokenTypeHint'
          description: Type of the token.
        client_id:
          type: string
          description: ID of the client.
        client_assertion_type:
          type: string
          description: Type of the client assertion. It is `urn:ietf:params:oauth:client-assertion-type:jwt-bearer`.
        client_assertion:
          type: string
          format: password
          description: Signed JWT (`private_key_jwt`) that authenticates a service client.
      description: |-
        Form body of an introspection request (RFC 7662).
        The client fields are optional in the schema. A missing assertion gives the OAuth error `invalid_client`.
    IntrospectResponse:
      type: object
      required:
        - active
      properties:
        active:
          type: boolean
          description: True if the token is active for the caller.
        scope:
          allOf:
            - $ref: '#/components/schemas/ScopeString'
          description: Permission keys of the token that the caller can use.
        sub:
          type: string
          description: ID of the user.
        aud:
          allOf:
            - $ref: '#/components/schemas/AppKey'
          description: The caller app.
        exp:
          type: integer
          format: int64
          description: Expiry time in seconds since the Unix epoch.
        iat:
          type: integer
          format: int64
          description: Issue time in seconds since the Unix epoch.
        jti:
          type: string
          description: ID of the API token.
        token_type:
          allOf:
            - $ref: '#/components/schemas/IntrospectedTokenType'
          description: Type of the token. It is `api_token` for an API token.
        principal_type:
          allOf:
            - $ref: '#/components/schemas/PrincipalType'
          description: Type of the principal. It is `user`.
      description: |-
        Result of an introspection request (RFC 7662).
        If `active` is false, no other field is present.
    IntrospectTokenTypeHint:
      anyOf:
        - type: string
          enum:
            - refresh_token
            - access_token
            - api_token
        - type: string
      description: Type hint of a token in an introspection request. The union is open.
    IntrospectedTokenType:
      anyOf:
        - type: string
          enum:
            - api_token
        - type: string
      description: Type of an introspected token. The union is open.
    Invite:
      type: object
      required:
        - url
        - expiresAt
      properties:
        url:
          type: string
          format: password
          description: URL of the invite. It is a secret. The server shows it one time.
        expiresAt:
          type: string
          format: date-time
          description: Time when the invite ends.
      description: An invite that lets a user set up a sign-in.
    JsonWebKey:
      type: object
      required:
        - kty
        - crv
        - x
        - 'y'
        - kid
      properties:
        kty:
          type: string
          enum:
            - EC
          description: Key type.
        crv:
          type: string
          enum:
            - P-256
          description: Curve.
        x:
          type: string
          description: X coordinate in base64url form.
        'y':
          type: string
          description: Y coordinate in base64url form.
        kid:
          type: string
          description: ID of the key.
        use:
          type: string
          enum:
            - sig
          description: Use of the key.
        alg:
          type: string
          enum:
            - ES256
          description: Algorithm of the key.
      additionalProperties:
        not: {}
      description: |-
        A public EC P-256 key in JWK format (RFC 7517).
        The model is closed. A private field such as `d`, `p`, `q`, `dp`, `dq`, `qi`, or `k` is not valid.
    JsonWebKeySet:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/JsonWebKey'
          description: The public keys.
      description: A set of public keys in JWK format.
    NoStoreHeaders:
      type: object
      description: |-
        Response headers for a response that has a token, a secret, or personal data.
        A cache must not keep the response (RFC 6749 section 5.1).
    NotFound:
      type: object
      allOf:
        - $ref: '#/components/schemas/Problem'
      description: The resource does not exist.
    OAuthError:
      type: object
      required:
        - error
      properties:
        error:
          allOf:
            - $ref: '#/components/schemas/OAuthErrorCode'
          description: The error code.
        error_description:
          type: string
          description: Text for a developer. It has no internal data and no secret.
      description: |-
        Error body of an OAuth operation (RFC 6749 section 5.2).
        The status is 400, except for these codes. `invalid_client` is 401.
        `server_error` is 500. `temporarily_unavailable` is 503 when the service cannot do the request now.
        `temporarily_unavailable` is 429 for a rate limit (model `OAuthTooManyRequests`).
        The client can try again after `Retry-After` of a 429 response. A 503 response of this model has no `Retry-After`.
    OAuthErrorCode:
      anyOf:
        - type: string
          enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - unauthorized_client
            - unsupported_grant_type
            - invalid_scope
            - invalid_target
            - unsupported_token_type
            - temporarily_unavailable
            - server_error
        - type: string
      description: Error code of an OAuth operation. The union is open.
    OAuthServiceUnavailable:
      type: object
      required:
        - error
      properties:
        error:
          allOf:
            - $ref: '#/components/schemas/OAuthErrorCode'
          description: The error code. It is `temporarily_unavailable`.
        error_description:
          type: string
          description: Text for a developer. It has no internal data and no secret.
      description: |-
        An OAuth operation cannot do the request now, for example because the rate limiter is not available.
        The `error` is `temporarily_unavailable`. The body has the same fields as `OAuthError`.
    OAuthTooManyRequests:
      type: object
      required:
        - error
      properties:
        error:
          allOf:
            - $ref: '#/components/schemas/OAuthErrorCode'
          description: The error code. It is `temporarily_unavailable`.
        error_description:
          type: string
          description: Text for a developer. It has no internal data and no secret.
      description: |-
        An OAuth operation limits the rate of requests (RFC 6749 section 5.2).
        The `error` is `temporarily_unavailable`. The client tries again after `Retry-After`.
        The body has the same fields as `OAuthError`.
        The status, the body, and `Retry-After` do not change when a `client_id` or a user exists or does not exist.
        The response does not give the limit key, the limit value, or the remaining requests.
    PermissionDefinition:
      type: object
      required:
        - key
        - description
      properties:
        key:
          allOf:
            - $ref: '#/components/schemas/PermissionKey'
          description: Key of the permission.
        description:
          type: string
          description: Description of what the permission allows.
      description: One permission that a service defines.
    PermissionKey:
      type: string
      maxLength: 128
      pattern: ^(?:[a-z][a-z0-9_]*:[a-z][a-z0-9_]*:[a-z][a-z0-9_]*|identity:admin)$
      description: |-
        Key of a permission in the form `<app>:<resource>:<action>`, for example `helpdesk:ticket:write`.
        The only exception is `identity:admin`, the permission of full administration of the identity service.
    PermissionManifest:
      type: object
      required:
        - app
        - permissions
        - defaultRoles
      properties:
        app:
          allOf:
            - $ref: '#/components/schemas/AppKey'
          description: Key of the application that owns the permissions.
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionDefinition'
          description: Permissions that the application defines.
        defaultRoles:
          type: array
          items:
            $ref: '#/components/schemas/RoleDefinition'
          description: Default roles of the application.
      description: The permissions and default roles that a service publishes.
    PrincipalType:
      type: string
      enum:
        - user
        - agent
        - service
        - workflow
      description: Type of a principal.
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri
          description: URI reference that identifies the problem type.
          default: about:blank
        title:
          type: string
          description: Short summary of the problem. It contains no internal data.
        status:
          type: integer
          format: int32
          description: HTTP status code.
        detail:
          type: string
          description: Explanation of this occurrence of the problem. It contains no internal data.
        instance:
          type: string
          description: URI reference of this occurrence. It contains no personal data and no secret.
        code:
          type: string
          maxLength: 64
          description: Stable code that a machine can read, for example `ticket_not_found`.
        requestId:
          type: string
          description: ID of the request. An operator uses it to find the error in the logs.
        traceId:
          type: string
          description: ID of the trace. An operator uses it to find the error in the traces.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
          description: Field errors. Only for validation errors.
      description: Problem details for an HTTP API (RFC 9457).
    PublishedManifest:
      type: object
      required:
        - manifest
        - version
        - publishedAt
      properties:
        manifest:
          allOf:
            - $ref: '#/components/schemas/PermissionManifest'
          description: The manifest.
        version:
          type: integer
          format: int32
          description: Version of the stored manifest. It increases with each change.
        publishedAt:
          type: string
          format: date-time
          description: Time of the last publish.
      description: A permission manifest that the identity service stores.
    PublishedManifestPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublishedManifest'
          description: Items of the page.
        nextPageToken:
          type: string
          description: Token for the next page. No value means that this is the last page.
      description: One page of manifests.
    RequestScopeString:
      type: string
      maxLength: 4096
      pattern: '^(?:[a-z][a-z0-9_]*:[a-z][a-z0-9_]*:[a-z][a-z0-9_]*|identity:admin|openid|profile|email|offline_access)(?: (?:[a-z][a-z0-9_]*:[a-z][a-z0-9_]*:[a-z][a-z0-9_]*|identity:admin|openid|profile|email|offline_access))*$'
      description: |-
        Space-separated scope values in a token request or an authorize request.
        Each value is a permission key or one of `openid`, `profile`, `email`, and `offline_access`.
    RevokeRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          format: password
          description: The token to revoke.
        token_type_hint:
          allOf:
            - $ref: '#/components/schemas/TokenTypeHint'
          description: Type of the token.
        client_id:
          type: string
          description: ID of the client.
        client_assertion_type:
          type: string
          description: Type of the client assertion.
        client_assertion:
          type: string
          format: password
          description: Signed JWT that authenticates a service client.
      description: Form body of a revoke request (RFC 7009).
    Role:
      type: object
      required:
        - ref
        - app
        - key
        - name
        - description
        - permissions
      properties:
        ref:
          allOf:
            - $ref: '#/components/schemas/RoleRef'
          description: Reference of the role in the form `<app>:<role>`.
        app:
          allOf:
            - $ref: '#/components/schemas/AppKey'
          description: Application that owns the role.
        key:
          allOf:
            - $ref: '#/components/schemas/RoleKey'
          description: Key of the role in the application.
        name:
          type: string
          description: Display name of the role.
        description:
          type: string
          description: Description of the role.
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionKey'
          description: Permissions that the role grants.
      description: A role from a manifest.
    RoleAssignment:
      type: object
      required:
        - role
        - source
        - pending
      properties:
        role:
          allOf:
            - $ref: '#/components/schemas/RoleRef'
          description: The role.
        source:
          allOf:
            - $ref: '#/components/schemas/AssignmentSource'
          description: '`config` if the assignment is from a configuration file. `api` if it is from the API.'
        pending:
          type: boolean
          description: True if the role is not in the current manifest of its app.
      description: A role that a user or a client has.
    RoleAssignmentPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoleAssignment'
          description: Items of the page.
        nextPageToken:
          type: string
          description: Token for the next page. No value means that this is the last page.
      description: One page of role assignments.
    RoleDefinition:
      type: object
      required:
        - key
        - name
        - description
        - permissions
      properties:
        key:
          allOf:
            - $ref: '#/components/schemas/RoleKey'
          description: Key of the role.
        name:
          type: string
          description: Display name of the role.
        description:
          type: string
          description: Description of the role.
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionKey'
          description: Permissions that the role grants.
      description: A default role of a service, with its permissions.
    RoleKey:
      type: string
      maxLength: 64
      pattern: ^[a-z][a-z0-9_]*$
      description: Key of a role, for example `agent_admin`.
    RolePage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          description: Items of the page.
        nextPageToken:
          type: string
          description: Token for the next page. No value means that this is the last page.
      description: One page of roles.
    RoleRef:
      type: string
      maxLength: 97
      pattern: ^[a-z][a-z0-9_]*:[a-z][a-z0-9_]*$
      description: Reference to a role in the form `<app>:<role>`, for example `helpdesk:agent`.
    ScopeString:
      type: string
      maxLength: 4096
      pattern: '^(?:[a-z][a-z0-9_]*:[a-z][a-z0-9_]*:[a-z][a-z0-9_]*|identity:admin)(?: (?:[a-z][a-z0-9_]*:[a-z][a-z0-9_]*:[a-z][a-z0-9_]*|identity:admin))*$'
      description: |-
        Space-separated permission keys, for example `helpdesk:ticket:read helpdesk:ticket:write`.
        It holds permission keys only. It never holds an OIDC scope.
    ServiceUnavailable:
      type: object
      allOf:
        - $ref: '#/components/schemas/Problem'
      description: The service is not available.
    Session:
      type: object
      required:
        - id
        - userId
        - createdAt
        - lastSeenAt
        - expiresAt
      properties:
        id:
          type: string
          description: ID of the session.
        userId:
          type: string
          description: ID of the user.
        createdAt:
          type: string
          format: date-time
          description: Time when the session started.
        lastSeenAt:
          type: string
          format: date-time
          description: Time of the last use of the session.
        expiresAt:
          type: string
          format: date-time
          description: Time when the session ends.
        userAgent:
          type: string
          description: User agent of the browser.
        ipAddress:
          type: string
          description: IP address of the last request.
      description: A sign-in session of a user.
    SessionPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Session'
          description: Items of the page.
        nextPageToken:
          type: string
          description: Token for the next page. No value means that this is the last page.
      description: One page of sessions.
    TokenRequest:
      type: object
      required:
        - grant_type
      properties:
        grant_type:
          allOf:
            - $ref: '#/components/schemas/GrantType'
          description: The grant type.
        client_id:
          type: string
          description: ID of the client.
        client_assertion_type:
          type: string
          description: Type of the client assertion. For a service client it is `urn:ietf:params:oauth:client-assertion-type:jwt-bearer`.
        client_assertion:
          type: string
          format: password
          description: Signed JWT (`private_key_jwt`) that authenticates a service client.
        scope:
          allOf:
            - $ref: '#/components/schemas/RequestScopeString'
          description: Requested scopes.
        audience:
          allOf:
            - $ref: '#/components/schemas/AppKey'
          description: Application key of the audience of the access token.
        code:
          type: string
          format: password
          description: Authorization code. For the grant `authorization_code`.
        code_verifier:
          type: string
          format: password
          description: PKCE code verifier. For the grant `authorization_code`.
        redirect_uri:
          type: string
          description: Redirect URI of the authorize request. For the grant `authorization_code`.
        refresh_token:
          type: string
          format: password
          description: Refresh token. For the grant `refresh_token`.
        subject_token:
          type: string
          maxLength: 4096
          format: password
          description: Access token of the user. For the grant `urn:ietf:params:oauth:grant-type:token-exchange`.
        subject_token_type:
          allOf:
            - $ref: '#/components/schemas/TokenType'
          description: Type of the subject token. It is the access token URI. For token exchange.
        actor_token:
          type: string
          format: uuid
          description: ID of an agent, not a signed token. For token exchange. It goes together with `actor_token_type`.
        actor_token_type:
          allOf:
            - $ref: '#/components/schemas/TokenType'
          description: Type of the actor token. It is `urn:constellation:params:oauth:token-type:agent-id`. For token exchange.
        requested_token_type:
          allOf:
            - $ref: '#/components/schemas/TokenType'
          description: Type of the token that the client asks for. It is the access token URI. For token exchange.
      description: Form body of a token request. The OAuth field names are in snake case, as RFC 6749 requires.
    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - scope
      properties:
        access_token:
          type: string
          format: password
          description: The access token.
        token_type:
          type: string
          enum:
            - Bearer
          description: Type of the token.
        expires_in:
          type: integer
          format: int32
          description: Lifetime of the access token in seconds.
        scope:
          allOf:
            - $ref: '#/components/schemas/ScopeString'
          description: Permission keys that the access token grants. It has no OIDC scope.
        refresh_token:
          type: string
          format: password
          description: Refresh token. Present if the request had the scope `offline_access`.
        id_token:
          type: string
          format: password
          description: ID token. Present if the request had the scope `openid`.
        issued_token_type:
          allOf:
            - $ref: '#/components/schemas/TokenType'
          description: Type of the issued token. The identity service sets it for token exchange.
      description: Result of a successful token request.
    TokenType:
      anyOf:
        - type: string
          enum:
            - urn:ietf:params:oauth:token-type:access_token
            - urn:constellation:params:oauth:token-type:agent-id
        - type: string
      description: Type of a token in a token exchange request. The union is open.
    TokenTypeHint:
      anyOf:
        - type: string
          enum:
            - refresh_token
            - access_token
        - type: string
      description: Type hint of a token in a revoke request. The union is open.
    TooManyRequests:
      type: object
      allOf:
        - $ref: '#/components/schemas/Problem'
      description: The client sent too many requests.
    Unauthorized:
      type: object
      allOf:
        - $ref: '#/components/schemas/Problem'
      description: The request has no valid credentials.
    UnprocessableContent:
      type: object
      allOf:
        - $ref: '#/components/schemas/Problem'
      description: The request is well formed, but the server cannot process its content.
    User:
      type: object
      required:
        - id
        - email
        - name
        - status
        - createdAt
      properties:
        id:
          type: string
          description: ID of the user.
        email:
          type: string
          description: Email address of the user.
        name:
          type: string
          description: Display name of the user.
        status:
          allOf:
            - $ref: '#/components/schemas/UserStatus'
          description: Status of the user.
        createdAt:
          type: string
          format: date-time
          description: Time when the user was created.
      description: A user.
    UserCreate:
      type: object
      required:
        - email
        - name
      properties:
        email:
          type: string
          description: Email address of the user.
        name:
          type: string
          description: Display name of the user.
      description: Request to create a user.
    UserCreated:
      type: object
      required:
        - user
        - invite
      properties:
        user:
          allOf:
            - $ref: '#/components/schemas/User'
          description: The new user.
        invite:
          allOf:
            - $ref: '#/components/schemas/Invite'
          description: The invite of the new user.
      description: Result of the creation of a user.
    UserInfo:
      type: object
      required:
        - sub
      properties:
        sub:
          type: string
          description: ID of the user.
        email:
          type: string
          description: Email address of the user.
        email_verified:
          type: boolean
          description: True if the email address is verified.
        name:
          type: string
          description: Display name of the user.
      description: Claims of the userinfo endpoint.
    UserPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
          description: Items of the page.
        nextPageToken:
          type: string
          description: Token for the next page. No value means that this is the last page.
      description: One page of users.
    UserStatus:
      type: string
      enum:
        - invited
        - active
        - disabled
      description: Status of a user.
    UserUpdate:
      type: object
      properties:
        name:
          type: string
          description: Display name of the user.
        disabled:
          type: boolean
          description: True to disable the user. False to enable the user.
      description: Request to change a user. A field that is not present does not change.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer

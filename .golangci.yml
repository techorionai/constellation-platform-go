          deny:
            - pkg: github.com/techorionai/constellation-platform-go/auth/jwt
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/auth/introspect
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/auth/clientcred
              desc: An adapter must not import another adapter. Use the port auth.TokenSource.
            - pkg: github.com/techorionai/constellation-platform-go/migrate/postgres
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/health/postgres
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/health/valkey
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/cache/valkey
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/transaction/postgres
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/secrets/postgres
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/retention/postgres
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/clients/identity
              desc: An adapter must not import another adapter.
        adapter-outbox-postgres:
          files:
            - "**/outbox/postgres/*.go"
            - "!$test"
          deny:
            - pkg: github.com/techorionai/constellation-platform-go/auth/clientcred
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/clients/identity
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/clients/events
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/auth/jwt
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/auth/introspect
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/migrate/postgres
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/health/postgres
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/health/valkey
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/cache/valkey
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/transaction/postgres
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/secrets/postgres
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/retention/postgres
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/streams/valkey
              desc: An adapter must not import another adapter.
        adapter-streams-valkey:
          files:
            - "**/streams/valkey/*.go"
            - "!$test"
          deny:
            - pkg: github.com/techorionai/constellation-platform-go/auth/clientcred
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/clients/identity
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/clients/events
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/auth/jwt
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/auth/introspect
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/migrate/postgres
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/health/postgres
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/health/valkey
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/cache/valkey
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/transaction/postgres
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/secrets/postgres
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/retention/postgres
              desc: An adapter must not import another adapter.
            - pkg: github.com/techorionai/constellation-platform-go/outbox/postgres
              desc: An adapter must not import another adapter.
        # Only clients/identity and clients/events import the runtime packages of oapi-codegen.
        oapi-runtime-only-in-clients:
          files:
            - "$all"
            - "!**/clients/identity/*.go"
            - "!**/clients/events/*.go"
          deny:
            - pkg: github.com/oapi-codegen
              desc: Only a generated client package can import the oapi-codegen runtime.
        # Only the adapters auth/jwt and auth/clientcred and the test issuer use the
        # JOSE library.
        # The root packages auth and requestid do not import it. This applies to
        # the test files too.
        no-jose-in-auth-root:
          files:
            - "**/auth/*.go"
            - "**/requestid/*.go"
          deny:
            - pkg: github.com/go-jose/go-jose
              desc: Only auth/jwt can import the JOSE library.
        # Production code does not import the test helpers.
        no-test-helpers-in-production:
          files:
            - "$all"
            - "!$test"
            - "!**/resources/test/**"
          deny:
            - pkg: github.com/techorionai/constellation-platform-go/resources/test
              desc: Only test code can import the test helpers.

formatters:
  enable:
    - gofmt
    - goimports
